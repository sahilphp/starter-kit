name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4
        with:
          repository: sahilphp/framework
          path: framework

      - uses: actions/checkout@v4
        with:
          path: starter-kit

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: openssl, json, mbstring, pdo

      - name: Validate composer.json
        working-directory: starter-kit
        run: composer validate --strict

      - name: Link the sibling framework checkout
        working-directory: starter-kit
        run: >
          composer config repositories.framework
          '{"type":"path","url":"../framework","options":{"symlink":true,"versions":{"sahilphp/framework":"1.0.0"}}}'

      - name: Install dependencies
        working-directory: starter-kit
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Test
        working-directory: starter-kit
        run: composer test

      - name: Dependency audit
        working-directory: starter-kit
        run: composer audit

  create-project:
    name: composer create-project end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sahilphp/framework
          path: framework

      - uses: actions/checkout@v4
        with:
          path: starter-kit

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          extensions: openssl, json, mbstring, pdo

      - name: Create a project from the local package
        run: >
          composer create-project
          --repository='{"type":"path","url":"'$PWD'/starter-kit","options":{"symlink":false}}'
          --stability=dev --no-interaction --no-progress
          sahilphp/starter-kit app

      - name: Post-install state
        run: |
          test -f app/.env
          grep -q '^APP_KEY=base64:' app/.env
          test -d app/storage/framework/sessions
          php app/bin/sahil about
          php app/bin/sahil --version

      - name: Boot the application and request the homepage
        run: |
          php -S 127.0.0.1:8080 -t app/public app/public/index.php &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8080/health | grep -q '"status":"ok"'
          curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ | grep -q 200
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/missing | grep -q 404
          kill %1

      - name: Run the project test suite
        working-directory: app
        run: composer test
